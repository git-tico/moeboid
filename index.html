<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="portrait">
    <title>Moeboid - Eat or be Eaten</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
            touch-action: none;
        }
        /* Mobile joystick & controls */
        #joystick-zone {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; display: none;
        }
        #joystick-base {
            position: fixed; width: 120px; height: 120px; border-radius: 50%;
            background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.22);
            display: none; pointer-events: none; z-index: 11;
            transform: translate(-50%, -50%);
        }
        #joystick-nub {
            position: fixed; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.30);
            display: none; pointer-events: none; z-index: 12;
            transform: translate(-50%, -50%);
        }
        #mobile-pause {
            position: fixed; top: 12px; right: 12px;
            width: 40px; height: 40px; border-radius: 6px;
            background: #12212f; border: 1px solid rgba(105,254,165,0.2);
            color: #69fea5; font-size: 18px; line-height: 40px; text-align: center;
            box-shadow: 0 0 15px rgba(105,254,165,0.15);
            z-index: 20; display: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #calibrate-btn {
            position: fixed; left: 50%; top: 63%; transform: translate(-50%, -50%);
            width: 220px; height: 50px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #59ef98, #14c16f);
            color: #050f1a; font-family: 'Space Grotesk', sans-serif;
            font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
            z-index: 30; display: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 20px rgba(105,254,165,0.35);
        }
        #calibrate-btn:active { opacity: 0.8; }
        #dash-btn {
            position: fixed; bottom: 24px; right: 24px;
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(105,254,165,0.2); border: 2px solid rgba(105,254,165,0.5);
            color: #69fea5; font-size: 24px;
            z-index: 20; display: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.2s, transform 0.1s;
        }
        #dash-btn:active { transform: scale(0.9); }
        #dash-btn.cooldown { opacity: 0.3; border-color: rgba(105,254,165,0.15); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="joystick-zone"></div>
    <div id="joystick-base"></div>
    <div id="joystick-nub"></div>
    <button id="mobile-pause">⏸</button>
    <button id="calibrate-btn">CALIBRATE & START</button>
    <button id="dash-btn">&#x26A1;</button>
    <script src="game.js"></script>
</body>
</html>
